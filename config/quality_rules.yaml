rules:
  - id: "RULE_MANDATORY_ATA"
    scope: "vessel_call"
    severity: "HIGH"
    type: "COMPLETENESS"
    pass_fail_expression: "ATA is not null"
    remediation_guidance: "Provide ATA"
  - id: "RULE_ETA_BEFORE_ATA"
    scope: "vessel_call"
    severity: "HIGH"
    type: "OPERATIONAL_SEQUENCE"
    pass_fail_expression: "ETA < ATA"
    remediation_guidance: "ETA must be before ATA"
  - id: "RULE_MISSING_SERVICE_EVENT"
    scope: "service_request"
    severity: "HIGH"
    type: "COMPLETENESS"
    pass_fail_expression: "if request exists, schedule should exist"
    remediation_guidance: "Missing service event"
  - id: "RULE_PILOT_ON_BOARD_BEFORE_SCHEDULED"
    scope: "service_execution"
    severity: "CRITICAL"
    type: "OPERATIONAL_SEQUENCE"
    pass_fail_expression: "pilot on board after scheduled"
    remediation_guidance: "Pilot on board before scheduled"
  - id: "RULE_DELAY_REASON"
    scope: "delay"
    severity: "MEDIUM"
    type: "COMPLETENESS"
    pass_fail_expression: "if delay > 0 then reason is not null"
    remediation_guidance: "Delay reason required"
  - id: "RULE_ORPHAN_EVENT"
    scope: "event_occurrence"
    severity: "CRITICAL"
    type: "IDENTITY"
    pass_fail_expression: "vessel_call_id is not null"
    remediation_guidance: "Event must map to a known vessel call"
