rules:
  - id: "RULE_MANDATORY_ATA"
    scope: "vessel_call"
    severity: "HIGH"
    type: "COMPLETENESS"
    pass_fail_expression: "ATA is not null"
    remediation_guidance: "Provide ATA"
  - id: "RULE_ETA_BEFORE_ATA"
    scope: "vessel_call"
    severity: "HIGH"
    type: "OPERATIONAL_SEQUENCE"
    pass_fail_expression: "ETA < ATA"
    remediation_guidance: "ETA must be before ATA"
  - id: "RULE_MISSING_SERVICE_EVENT"
    scope: "service_request"
    severity: "HIGH"
    type: "COMPLETENESS"
    pass_fail_expression: "if request exists, schedule should exist"
    remediation_guidance: "Missing service event"
  - id: "RULE_PILOT_ON_BOARD_BEFORE_SCHEDULED"
    scope: "service_execution"
    severity: "CRITICAL"
    type: "OPERATIONAL_SEQUENCE"
    pass_fail_expression: "pilot on board after scheduled"
    remediation_guidance: "Pilot on board before scheduled"
  - id: "RULE_DELAY_REASON"
    scope: "delay"
    severity: "MEDIUM"
    type: "COMPLETENESS"
    pass_fail_expression: "if delay > 0 then reason is not null"
    remediation_guidance: "Delay reason required"
  - id: "RULE_ORPHAN_EVENT"
    scope: "event_occurrence"
    severity: "CRITICAL"
    type: "IDENTITY"
    pass_fail_expression: "vessel_call_id is not null"
    remediation_guidance: "Event must map to a known vessel call"
  - id: "DQ-SERVICE-REQUEST-MISSING"
    scope: "service_request"
    severity: "HIGH"
    type: "COMPLETENESS"
    pass_fail_expression: "Requested_Time is not null"
    remediation_guidance: "Provide the source requested service time; do not infer it."
  - id: "DQ-SERVICE-SCHEDULE-MISSING"
    scope: "service_assignment"
    severity: "HIGH"
    type: "COMPLETENESS"
    pass_fail_expression: "Scheduled_Time is not null"
    remediation_guidance: "Provide the source scheduled service time; do not infer it."
  - id: "DQ-SERVICE-SERVED-MISSING"
    scope: "service_execution"
    severity: "HIGH"
    type: "COMPLETENESS"
    pass_fail_expression: "Served_Time is not null"
    remediation_guidance: "Provide the source actual/served service time; do not infer it."
  - id: "DQ-SERVICE-SCHEDULE-BEFORE-REQUEST"
    scope: "service_assignment"
    severity: "HIGH"
    type: "OPERATIONAL_SEQUENCE"
    pass_fail_expression: "Requested_Time <= Scheduled_Time"
    remediation_guidance: "Correct source chronology. Never swap or absolute-value timestamps."
  - id: "DQ-007"
    scope: "delay"
    severity: "MEDIUM"
    type: "COMPLETENESS"
    pass_fail_expression: "Positive execution delay has a nonblank governed delay reason"
    remediation_guidance: "Provide a delay reason. Early service (negative Served minus Scheduled) is not an error."
  - id: "DQ-INVALID-TIMESTAMP"
    scope: "staging_record"
    severity: "HIGH"
    type: "VALIDITY"
    pass_fail_expression: "Timestamp parses with declared source timezone"
    remediation_guidance: "Correct the original source value; preserve raw evidence and precision."
  - id: "DQ-MISSING-MANDATORY-FIELD"
    scope: "staging_record"
    severity: "HIGH"
    type: "COMPLETENESS"
    pass_fail_expression: "Mandatory source fields are nonblank"
    remediation_guidance: "Provide the missing source field."
  - id: "DQ-DUPLICATE-ROW"
    scope: "staging_record"
    severity: "MEDIUM"
    type: "UNIQUENESS"
    pass_fail_expression: "No exact duplicate canonical source row exists in the dataset group"
    remediation_guidance: "Review duplicate evidence before excluding from analysis."
  - id: "DQ-SEQUENCE-VIOLATION"
    scope: "event_occurrence"
    severity: "CRITICAL"
    type: "OPERATIONAL_SEQUENCE"
    pass_fail_expression: "Configured DAG predecessor occurs before successor"
    remediation_guidance: "Review the ordered event pair. Legitimate parallel activities are not a violation."
