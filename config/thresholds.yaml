# Thresholds
thresholds:
  auto_merge: 0.98
  steward_review: 0.85
  outlier_sigma: 3
  survivorship:
    strategy: "completeness_and_recency"
    source_priority:
      - "AIS"
      - "PORT_AUTHORITY"
      - "TERMINAL"
      - "AGENT"
      - "MANUAL"
      - "SYNTHETIC"
  canonical_occurrence_selection:
    # Order of precedence when multiple observations exist for the same logical event.
    # 1. verification_status: Verified beats Conflicting beats Unverified/unknown
    # 2. confidence: higher wins
    # 3. source_system priority (below): earlier wins
    verification_priority:
      - "Verified"
      - "Conflicting"
    source_priority:
      - "AIS"
      - "VTS"
      - "Pilot System"
      - "Berthing Log"
      - "Tug System"
      - "PMS"
      - "TOS"
      - "Arrival Notification"
      - "Agent Portal"
      - "Manual Log"
