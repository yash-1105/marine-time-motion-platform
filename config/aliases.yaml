# Event aliases
aliases:
  - alias: "Expected Time of Arrival"
    event_name: "ETA"
    match_type: "EXACT"
  - alias: "Actual Time of Arrival"
    event_name: "ATA"
    match_type: "EXACT"
  - alias: "Expected Time of Departure"
    event_name: "ETD"
    match_type: "EXACT"
  - alias: "Actual Time of Departure"
    event_name: "ATD"
    match_type: "EXACT"
  - alias: "Port Limits"
    event_name: "Port Limit In"
    match_type: "EXACT"
  - alias: "PILOT_ON_BOARD_ARRIVAL"
    event_name: "Pilot On Board"
    match_type: "EXACT"
  - alias: "ALL_FAST_ARRIVAL"
    event_name: "All Fast"
    match_type: "EXACT"
  - alias: "LAST_LINE_UNTIED_SAILING"
    event_name: "Last Line Untied"
    match_type: "EXACT"
  - alias: "BREAKWATER_OUT"
    event_name: "Breakwater Out"
    match_type: "EXACT"
  - alias: "CARGO_START"
    event_name: "Cargo Operations Start"
    match_type: "EXACT"
  - alias: "CARGO_END"
    event_name: "Cargo Operations End"
    match_type: "EXACT"
  # FRD v2 §4.2.2 aliases. Movement-scoped aliases are resolved with the
  # source Movement_Type; ambiguous unscoped values are never guessed.
  - alias: "Nomination Date"
    event_name: "NOMINATION_SUBMITTED"
    match_type: "CASE_INSENSITIVE"
  - alias: "Submission Date"
    event_name: "NOMINATION_SUBMITTED"
    match_type: "CASE_INSENSITIVE"
  - alias: "Pilot Request Time 1"
    event_name: "PILOT_REQUEST_ARRIVAL"
    match_type: "CASE_INSENSITIVE"
  - alias: "Pilot Assigned Time 1"
    event_name: "PILOT_ASSIGNED_ARRIVAL"
    match_type: "CASE_INSENSITIVE"
  - alias: "Actual scheduled Date/Time"
    event_name: "PILOT_ASSIGNED_ARRIVAL"
    match_type: "CASE_INSENSITIVE"
    movement_scope: "ARRIVAL"
  - alias: "Pilotage Start Time 1"
    event_name: "PILOTAGE_START_ARRIVAL"
    match_type: "CASE_INSENSITIVE"
  - alias: "Pilot On-Board 1"
    event_name: "PILOT_ON_BOARD_ARRIVAL"
    match_type: "CASE_INSENSITIVE"
  - alias: "Pilot Off-Board 1"
    event_name: "PILOT_DISEMBARK_ARRIVAL"
    match_type: "CASE_INSENSITIVE"
  - alias: "Pilotage End Time 1"
    event_name: "PILOTAGE_END_ARRIVAL"
    match_type: "CASE_INSENSITIVE"
  - alias: "Pilot Request Time 2"
    event_name: "PILOT_REQUEST_SHIFTING"
    match_type: "CASE_INSENSITIVE"
  - alias: "Pilot Assigned Time 2"
    event_name: "PILOT_ASSIGNED_SHIFTING"
    match_type: "CASE_INSENSITIVE"
  - alias: "Pilotage Start Time 2"
    event_name: "PILOTAGE_START_SHIFTING"
    match_type: "CASE_INSENSITIVE"
  - alias: "Pilot On-Board 2"
    event_name: "PILOT_ON_BOARD_SHIFTING"
    match_type: "CASE_INSENSITIVE"
  - alias: "Pilot Off-Board 2"
    event_name: "PILOT_DISEMBARK_SHIFTING"
    match_type: "CASE_INSENSITIVE"
  - alias: "Pilotage End Time 2"
    event_name: "PILOTAGE_END_SHIFTING"
    match_type: "CASE_INSENSITIVE"
  - alias: "Pilot Request Time 3"
    event_name: "PILOT_REQUEST_SAILING"
    match_type: "CASE_INSENSITIVE"
  - alias: "Pilot Assigned Time 3"
    event_name: "PILOT_ASSIGNED_SAILING"
    match_type: "CASE_INSENSITIVE"
  - alias: "Pilotage Start Time 3"
    event_name: "PILOTAGE_START_SAILING"
    match_type: "CASE_INSENSITIVE"
  - alias: "Pilot On-Board 3"
    event_name: "PILOT_ON_BOARD_SAILING"
    match_type: "CASE_INSENSITIVE"
  - alias: "Pilot Off-Board 3"
    event_name: "PILOT_DISEMBARK_SAILING"
    match_type: "CASE_INSENSITIVE"
  - alias: "Pilotage End Time 3"
    event_name: "PILOTAGE_END_SAILING"
    match_type: "CASE_INSENSITIVE"
  - alias: "Requested time"
    event_name: "PILOT_REQUEST_{MOVEMENT}"
    match_type: "MOVEMENT_SCOPED"
  - alias: "Scheduled time"
    event_name: "PILOT_ASSIGNED_{MOVEMENT}"
    match_type: "MOVEMENT_SCOPED"
  - alias: "Served Date and Time"
    event_name: "PILOTAGE_START_{MOVEMENT}"
    match_type: "MOVEMENT_SCOPED"
  - alias: "From Loc"
    event_name: "from_location"
    match_type: "FIELD_ALIAS"
  - alias: "To Loc"
    event_name: "to_location"
    match_type: "FIELD_ALIAS"
  - alias: "Last Port"
    event_name: "last_port_of_call"
    match_type: "FIELD_ALIAS"
  - alias: "Next Port"
    event_name: "next_port_of_call"
    match_type: "FIELD_ALIAS"
