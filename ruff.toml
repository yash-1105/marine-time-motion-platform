target-version = "py312"
line-length = 120

[lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = [
    "B008",  # Do not perform function call in argument defaults (standard for FastAPI Depends)
    "B904",  # Exception chaining
    "E501",  # Line too long
]

[lint.per-file-ignores]
"apps/api/models/__init__.py" = ["F403", "F401"]
